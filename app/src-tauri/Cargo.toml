[package]
name = "mixitup"
version = "0.2.0"
edition = "2021"
description = "MixItUp – ChatMix pre SteelSeries slúchadlá bez Sonaru (od WheresTheApp)"

[[bin]]
name = "MixItUp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
windows-core = "0.61"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
