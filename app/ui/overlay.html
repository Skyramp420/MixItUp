<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>MixItUp</title>
<style>
@font-face{font-family:'Inter Variable';font-style:normal;font-weight:100 900;src:url(fonts/inter-latin-ext-wght-normal.woff2) format('woff2-variations');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+20AC}
@font-face{font-family:'Inter Variable';font-style:normal;font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2-variations');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F}
:root{--accent:#ff9f0a;--amber:#ffb340;--rec:#ff453a;--text:#f5f5f7;--muted:#a1a1a6;
  --spring:cubic-bezier(.32,1.25,.5,1);--ease:cubic-bezier(.25,.1,.25,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;height:100%}
body{display:flex;justify-content:center;align-items:flex-start;padding:10px 12px;font:400 13.5px/1.35 'Inter Variable','Segoe UI Variable Text','Segoe UI',sans-serif;
  letter-spacing:-.003em;font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased;color:var(--text);user-select:none;cursor:default}
.pill{--c:var(--amber);display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:22px;min-width:300px;
  background:rgba(36,36,38,.86);backdrop-filter:saturate(1.8) blur(28px);
  box-shadow:0 0 0 .5px rgba(255,255,255,.14),0 14px 40px rgba(0,0,0,.5);
  animation:in .6s var(--spring) both, out .35s var(--ease) 6.2s forwards}
.pill.crit{--c:var(--rec)}
@keyframes in{from{opacity:0;transform:translateY(-26px) scale(.9)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-14px) scale(.96)}}
.ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:nudge 1.6s .7s var(--ease) 2}
@keyframes nudge{0%,100%{transform:none}20%{transform:rotate(-9deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-4deg)}}
.tx b{display:block;font:650 14.5px/1.2 'Inter Variable','Segoe UI Variable Display','Segoe UI',sans-serif;letter-spacing:-.015em}
.tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.batt{margin-left:auto;display:flex;align-items:center;gap:8px;font:650 17px 'Inter Variable',sans-serif;letter-spacing:-.02em;color:var(--c);font-variant-numeric:tabular-nums}
.cell{position:relative;width:30px;height:15px;border-radius:4.5px;box-shadow:inset 0 0 0 1.6px currentColor;padding:2.5px}
.cell::after{content:'';position:absolute;right:-3.5px;top:4.5px;width:2px;height:6px;border-radius:0 1.5px 1.5px 0;background:currentColor}
.cell i{display:block;height:100%;border-radius:2px;background:currentColor;width:var(--b);animation:blink 1.1s .8s steps(1) 4}
@keyframes blink{50%{opacity:.25}}
</style>
</head>
<body>
<div class="pill" id="p">
  <div class="ic"><svg viewBox="0 0 16 16"><path d="M2.75 10V8a5.25 5.25 0 0 1 10.5 0v2"/><rect x="2" y="9.5" width="3" height="4.25" rx="1.2"/><rect x="11" y="9.5" width="3" height="4.25" rx="1.2"/></svg></div>
  <div class="tx"><b id="t">Slúchadlá sa vybíjajú</b><small id="s">Čoskoro ich daj nabiť</small></div>
  <div class="batt"><span class="cell"><i id="b"></i></span><span id="n">15 %</span></div>
</div>
<script>
  var q = new URLSearchParams(location.search), pct = +(q.get('pct') || 15), crit = q.get('crit') === '1' || pct <= 5;
  document.getElementById('n').textContent = pct + ' %';
  document.getElementById('b').style.setProperty('--b', Math.max(6, Math.min(100, pct)) + '%');
  if (crit) {
    document.getElementById('p').classList.add('crit');
    document.getElementById('t').textContent = 'Slúchadlá sa čoskoro vypnú';
    document.getElementById('s').textContent = 'Zapoj kábel, inak o chvíľu stíchnu';
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
</body>
</html>
