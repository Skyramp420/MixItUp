<!doctype html>
<html lang="sk" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MixItUp</title>
<link rel="stylesheet" href="style.css">
<script>
  // téma ešte pred vykreslením (bez bliknutia)
  (function(){var t='auto';try{t=localStorage.getItem('miu.theme')||'auto'}catch(e){}
   var dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
   document.documentElement.dataset.scheme=dark?'dark':'light'})();
</script>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="drag" data-tauri-drag-region></div>
    <div class="wc">
      <button id="wMin" title="Minimalizovať"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
      <button id="wMax" title="Maximalizovať"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></button>
      <button id="wClose" class="close" title="Zavrieť"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </div>

  <aside class="side">
    <div class="brand" data-tauri-drag-region>
      <div class="logo" id="logo">
        <svg viewBox="0 0 16 16"><path d="M3.2 9.6V8a4.8 4.8 0 0 1 9.6 0v1.6"/>
          <rect class="cup l" x="2.2" y="9" width="2.9" height="4.4" rx="1.2" fill="var(--accent-ink)" stroke="none"/>
          <rect class="cup r" x="10.9" y="9" width="2.9" height="4.4" rx="1.2" fill="var(--accent-ink)" stroke="none"/></svg>
      </div>
      <div><b>MixItUp</b><small>od WheresTheApp</small></div>
    </div>
    <nav class="nav" id="nav">
      <div class="ind" id="navInd"></div>
    </nav>
    <div class="spacer"></div>
    <div class="updcard" id="updCard" hidden></div>
    <div class="statuscard">
      <div class="row"><span class="dot" id="stDot"></span><span id="stText">Načítavam…</span></div>
      <div class="sub" id="stSub">&nbsp;</div>
    </div>
  </aside>

  <main class="main" id="main">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-apps" hidden></section>
    <section class="view" id="v-ss" hidden></section>
    <section class="view" id="v-settings" hidden></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
